# Local development stack. SANDBOX ONLY: synthetic data, simulated payout rail, no real funds.
#   scripts/generate-dev-secrets.sh && docker compose -f infra/docker/docker-compose.yml --env-file .env up --build
# Not production configuration: single broker, single database, no TLS, plain-text Kafka. See docs/PRODUCTION_GAP.md.

name: paynexa

x-service: &service
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  networks: [backend]

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?run scripts/generate-dev-secrets.sh}
      POSTGRES_DB: paynexa
      IDENTITY_MIGRATOR_PW: ${IDENTITY_MIGRATOR_PW:?}
      IDENTITY_APP_PW: ${IDENTITY_APP_PW:?}
      PAYMENTS_MIGRATOR_PW: ${PAYMENTS_MIGRATOR_PW:?}
      PAYMENTS_APP_PW: ${PAYMENTS_APP_PW:?}
      NOTIFICATION_MIGRATOR_PW: ${NOTIFICATION_MIGRATOR_PW:?}
      NOTIFICATION_APP_PW: ${NOTIFICATION_APP_PW:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/01-roles-and-schemas.sql:/sql/01-roles-and-schemas.sql:ro
      - ../postgres/docker-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paynexa"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  kafka:
    image: apache/kafka:3.9.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
    networks: [backend]

  identity-service:
    <<: *service
    build: { context: ../.., dockerfile: infra/docker/Dockerfile, args: { SERVICE: identity-service } }
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      SERVER_PORT: 8080
      IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/paynexa?currentSchema=identity
      IDENTITY_DB_USER: identity_app
      IDENTITY_DB_PASSWORD: ${IDENTITY_APP_PW:?}
      IDENTITY_DB_MIGRATOR_USER: identity_migrator
      IDENTITY_DB_MIGRATOR_PASSWORD: ${IDENTITY_MIGRATOR_PW:?}
      PAYNEXA_JWT_PRIVATE_KEY_FILE: /run/secrets/jwt_private
      PAYNEXA_BOOTSTRAP_ADMIN_EMAIL: ${PAYNEXA_BOOTSTRAP_ADMIN_EMAIL:-}
      PAYNEXA_BOOTSTRAP_ADMIN_PASSWORD: ${PAYNEXA_BOOTSTRAP_ADMIN_PASSWORD:-}
    secrets: [jwt_private]
    ports: ["127.0.0.1:8081:8080"]

  payments-service:
    <<: *service
    build: { context: ../.., dockerfile: infra/docker/Dockerfile, args: { SERVICE: payments-service } }
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      SERVER_PORT: 8080
      PAYMENTS_DB_URL: jdbc:postgresql://postgres:5432/paynexa?currentSchema=payments
      PAYMENTS_DB_USER: payments_app
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_APP_PW:?}
      PAYMENTS_DB_MIGRATOR_USER: payments_migrator
      PAYMENTS_DB_MIGRATOR_PASSWORD: ${PAYMENTS_MIGRATOR_PW:?}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYNEXA_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public
      PAYNEXA_SANDBOX_FUNDING: ${PAYNEXA_SANDBOX_FUNDING:-false}
    secrets: [jwt_public]
    ports: ["127.0.0.1:8082:8080"]

  notification-service:
    <<: *service
    build: { context: ../.., dockerfile: infra/docker/Dockerfile, args: { SERVICE: notification-service } }
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    environment:
      SERVER_PORT: 8080
      NOTIFICATION_DB_URL: jdbc:postgresql://postgres:5432/paynexa?currentSchema=notifications
      NOTIFICATION_DB_USER: notification_app
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_APP_PW:?}
      NOTIFICATION_DB_MIGRATOR_USER: notification_migrator
      NOTIFICATION_DB_MIGRATOR_PASSWORD: ${NOTIFICATION_MIGRATOR_PW:?}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAYNEXA_JWT_PUBLIC_KEY_FILE: /run/secrets/jwt_public
    secrets: [jwt_public]
    ports: ["127.0.0.1:8083:8080"]

networks:
  backend:

volumes:
  pgdata:

secrets:
  jwt_private:
    file: ../../secrets/jwt-private.pem
  jwt_public:
    file: ../../secrets/jwt-public.pem
