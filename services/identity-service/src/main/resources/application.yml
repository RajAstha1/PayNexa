spring:
  application:
    name: identity-service
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5432/paynexa?currentSchema=identity}
    username: ${IDENTITY_DB_USER:identity_app}
    password: ${IDENTITY_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${IDENTITY_DB_POOL:10}
      connection-timeout: 3000
  flyway:
    schemas: identity
    default-schema: identity
    user: ${IDENTITY_DB_MIGRATOR_USER:identity_migrator}
    password: ${IDENTITY_DB_MIGRATOR_PASSWORD:}
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs

paynexa:
  identity:
    jwt:
      # PKCS#8 PEM RSA private key (>= 2048 bits). No default: the service refuses to start without it.
      private-key: ${PAYNEXA_JWT_PRIVATE_KEY:}
      access-ttl: 10m
    refresh-ttl: 7d
    lockout:
      max-failed-attempts: 5
      duration: 15m
    bcrypt-cost: 12
    # Per client address on /auth/*. Defaults are strict. Behind the web console every request arrives from one address
    # unless the console forwards the user's address AND this service is told to trust it (only safe when the service is
    # reachable solely through that trusted proxy).
    rate-limit:
      auth-burst: ${IDENTITY_AUTH_BURST:10}
      auth-per-second: ${IDENTITY_AUTH_PER_SECOND:0.2}
      trust-forwarded-header: ${IDENTITY_TRUST_FORWARDED_HEADER:false}
    # Optional first administrator for sandbox setups. Both must be set; the account is created only if no admin exists.
    bootstrap-admin-email: ${PAYNEXA_BOOTSTRAP_ADMIN_EMAIL:}
    bootstrap-admin-password: ${PAYNEXA_BOOTSTRAP_ADMIN_PASSWORD:}
