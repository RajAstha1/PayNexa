spring:
  application:
    name: notification-service
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5432/paynexa?currentSchema=notifications}
    username: ${NOTIFICATION_DB_USER:notification_app}
    password: ${NOTIFICATION_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${NOTIFICATION_DB_POOL:10}
      connection-timeout: 3000
  flyway:
    schemas: notifications
    default-schema: notifications
    user: ${NOTIFICATION_DB_MIGRATOR_USER:notification_migrator}
    password: ${NOTIFICATION_DB_MIGRATOR_PASSWORD:}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
      properties:
        enable.idempotence: true
    listener:
      ack-mode: record
  threads:
    virtual:
      enabled: true

server:
  port: ${SERVER_PORT:8083}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs

paynexa:
  security:
    jwt:
      public-key: ${PAYNEXA_JWT_PUBLIC_KEY:}
  notifications:
    retry:
      max-attempts: 4
      initial-interval: 1s
      multiplier: 2.0
      max-interval: 10s
